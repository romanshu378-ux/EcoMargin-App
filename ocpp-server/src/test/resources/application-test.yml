spring:
  datasource:
    url: jdbc:h2:mem:ocpptestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: true
    show-sql: false

ocpp:
  heartbeat-interval: 60
  main-backend-url: http://localhost:8080
  internal-api-secret: test-secret
