server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: ocpp-server

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

ocpp:
  heartbeat-interval: ${OCPP_HEARTBEAT_INTERVAL:60}
  main-backend-url: ${MAIN_BACKEND_URL:https://ecomargin-app.onrender.com}
  internal-api-secret: ${INTERNAL_API_SECRET:ecomargin-internal-secret-key-2026}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}

logging:
  level:
    root: INFO
    com.ecomargin.ocpp: DEBUG
