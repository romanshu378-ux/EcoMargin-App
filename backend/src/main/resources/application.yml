server:
  port: ${PORT:8080}

spring:
  application:
    name: ecomargin-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  redis:
    enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:false}}
  data:
    redis:
      repositories:
        enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:false}}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:false}}

---
spring:
  config:
    activate:
      on-profile: dev
  redis:
    enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:true}}
  data:
    redis:
      repositories:
        enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:true}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomargin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 60000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

crypto:
  key: ${CRYPTO_KEY:404E635266556A586E3272357538782F}

---
spring:
  config:
    activate:
      on-profile: test
  redis:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 3600000

crypto:
  key: 404E635266556A586E3272357538782F

---
spring:
  config:
    activate:
      on-profile: prod
  redis:
    enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:false}}
  data:
    redis:
      repositories:
        enabled: ${ENABLE_REDIS:${SPRING_REDIS_ENABLED:false}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 60000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

crypto:
  key: ${CRYPTO_KEY:404E635266556A586E3272357538782F}

