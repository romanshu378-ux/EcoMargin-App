<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16A34A" />
    <link rel="manifest" href="/manifest.json" />
    <title>EcoMargin - Smart EV Charging Web Platform</title>
    <script>
      // 1. Global error listener for stale asset auto-healing
      window.addEventListener('error', function(event) {
        var isChunkError = event && (
          (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) ||
          (event.message && (event.message.indexOf('Loading chunk') !== -1 || event.message.indexOf('imported module') !== -1 || event.message.indexOf('SyntaxError') !== -1))
        );
        if (isChunkError) {
          console.warn('[EcoMargin] Stale asset detected. Purging cache and reloading...');
          if (!sessionStorage.getItem('ecomargin_asset_reloaded')) {
            sessionStorage.setItem('ecomargin_asset_reloaded', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(key) { caches.delete(key); });
              });
            }
            window.location.reload(true);
          }
        }
      }, true);

      // 2. Startup Watchdog: Ensure app never hangs on static splash screen (> 5 seconds)
      setTimeout(function() {
        var rootEl = document.getElementById('root');
        if (rootEl && rootEl.querySelector('.app-loader')) {
          console.warn('[EcoMargin] Startup timeout exceeded (5s). Fallback screen displayed.');
          rootEl.innerHTML = `
            <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #ffffff; padding: 24px; text-align: center; font-family: system-ui, sans-serif;">
              <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px;">⚠️</div>
              <h2 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 700;">EcoMargin Portal Connection Issue</h2>
              <p style="margin: 0 0 20px 0; font-size: 13px; color: #94a3b8; max-w: 360px; line-height: 1.5;">
                Unable to complete initial loading within 5 seconds. The portal may be updating or offline.
              </p>
              <button onclick="window.location.reload(true)" style="background: #16a34a; color: #ffffff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background 0.2s;">
                Retry Connection
              </button>
            </div>
          `;
        }
      }, 5000);
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }
      .app-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0f172a;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(22, 163, 74, 0.2);
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="spinner"></div>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #ffffff;">EcoMargin Portal</h2>
        <p style="margin: 0; font-size: 13px; color: #94a3b8;">Loading EV Charging Platform...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    installingWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          }).catch(function(err) {
            console.error('[EcoMargin] ServiceWorker registration failed: ', err);
          });

          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              if (!sessionStorage.getItem('ecomargin_sw_reloaded')) {
                sessionStorage.setItem('ecomargin_sw_reloaded', 'true');
                window.location.reload();
              }
            }
          });
        });
      }
    </script>
  </body>
</html>
