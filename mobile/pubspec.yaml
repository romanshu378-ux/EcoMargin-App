name: eco_margin_customer
description: "EcoMargin EV Charging Platform Customer Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.1

  # Networking
  dio: ^5.4.3+1
  http: ^1.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.1

  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  mobile_scanner: ^5.0.0
  url_launcher: ^6.2.5
  jwt_decoder: ^2.0.1
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
